name: Web demo

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Reject tags outside main history
        if: startsWith(github.ref, 'refs/tags/')
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6 (peeled commit)
      - run: uv sync --locked --group web
      - run: uv run --group web python -m playwright install --with-deps chromium
      - run: uv run pytest -q
      - run: uv run python -m validation.check_physics --out outputs/validation/physics.json
      - run: uv run python -m validation.check_aerosol --out outputs/validation/aerosol.json
      - name: Resolution checks
        run: |
          uv run python -m validation.check_convergence --aerosol opac --out outputs/validation/convergence-opac.json
          uv run python -m validation.check_convergence --aerosol opac-ft --out outputs/validation/convergence-opac-ft.json
          uv run python -m validation.check_convergence --aerosol none --out outputs/validation/convergence-none.json
      - name: Deterministic site build
        run: |
          uv run python tools/export_web_demo.py --out outputs/web-demo-a
          uv run python tools/export_web_demo.py --out outputs/web-demo-b
          diff -qr outputs/web-demo-a outputs/web-demo-b
      - name: Independent browser, CLI, pixel and performance gate
        run: uv run --group web python -m validation.check_web_demo --site outputs/web-demo-a --out outputs/validation/web-demo.json
      - name: Seal the exact validated site
        run: |
          uv run python - <<'PY'
          import hashlib, json, os, shutil
          from pathlib import Path
          site = Path('outputs/web-demo-a')
          report = json.loads(Path('outputs/validation/web-demo.json').read_text())
          digest = hashlib.sha256((site/'manifest.json').read_bytes()).hexdigest()
          assert report['pass'] and report['manifest_sha256'] == digest
          out = Path('outputs/publish')
          out.mkdir()
          shutil.copytree(site, out/'site')
          shutil.copyfile('outputs/validation/web-demo.json', out/'validation.json')
          (out/'receipt.json').write_text(json.dumps({'source_sha': os.environ['GITHUB_SHA'], 'manifest_sha256': digest}))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-site
          path: outputs/publish/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: validation-evidence
          path: outputs/validation/
          if-no-files-found: warn

  deploy:
    needs: validate
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-site
          path: verified
      - name: Verify source and manifest identity without rebuilding
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path('verified')
          receipt = json.loads((root/'receipt.json').read_text())
          report = json.loads((root/'validation.json').read_text())
          digest = hashlib.sha256((root/'site/manifest.json').read_bytes()).hexdigest()
          assert receipt['source_sha'] == os.environ['GITHUB_SHA']
          assert receipt['manifest_sha256'] == report['manifest_sha256'] == digest
          assert report['pass']
          manifest = json.loads((root/'site/manifest.json').read_text())
          for path, expected in manifest['inputs_sha256'].items():
              if path.startswith('web/'):
                  assert hashlib.sha256((root/'site'/path.removeprefix('web/')).read_bytes()).hexdigest() == expected
          for item in [manifest['common'], *manifest['families'].values()]:
              assert hashlib.sha256((root/'site'/item['file']).read_bytes()).hexdigest() == item['sha256']
          PY
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: verified/site
      - name: Deploy validated artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
